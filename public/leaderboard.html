<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehic-le · טבלת מובילים</title>
  <meta name="description" content="טבלת המובילים של Vehic-le — הלוחיות הנדירות ביותר שגולגלו והשחקנים המובילים לפי ניקוד." />
  <link rel="canonical" href="https://vehic-le.fly.dev/leaderboard.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vehic-le" />
  <meta property="og:title" content="Vehic-le · טבלת מובילים" />
  <meta property="og:description" content="טבלת המובילים של Vehic-le — הלוחיות הנדירות ביותר שגולגלו והשחקנים המובילים לפי ניקוד." />
  <meta property="og:url" content="https://vehic-le.fly.dev/leaderboard.html" />
  <meta property="og:image" content="https://vehic-le.fly.dev/icons/icon-512.png" />
  <meta property="og:locale" content="he_IL" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <main class="app">
    <nav class="topbar">
      <div class="topbar-start">
        <a class="topbar-brand" href="/">Vehic-le</a>
        <div class="nav-links">
          <a href="/" class="nav-btn">גלגול</a>
          <a href="/rate.html" class="nav-btn">דרג את הרכב שלי</a>
          <a href="/leaderboard.html" class="nav-btn nav-active">טבלת מובילים</a>
          <a id="historyLink" href="/history.html" class="nav-btn hidden">היסטוריה</a>
          <a id="adminLink" href="/admin.html" class="nav-btn hidden">ניהול</a>
        </div>
      </div>
      <div id="authArea" class="auth-area"></div>
    </nav>

    <header>
      <h1>טבלת מובילים</h1>
      <p class="tagline">הגלגולים בעלי הניקוד הגבוה ביותר</p>
    </header>

    <div class="tabs" id="periodTabs">
      <button class="tab active" data-period="today">היום</button>
      <button class="tab" data-period="30days">30 ימים</button>
      <button class="tab" data-period="alltime">כל הזמנים</button>
      <button class="tab" data-period="overall">ניקוד כולל</button>
      <button class="tab" data-period="streaks">רצפים</button>
    </div>

    <div class="perk-toggle" id="perkToggle">
      <button class="perk-btn active" data-mode="with">כולל בונוסי לוחית</button>
      <button class="perk-btn" data-mode="without">רכב בלבד</button>
    </div>

    <div class="featured-roll hidden" id="featuredRoll">
      <div class="featured-rank" id="featuredRank">🏆 #1</div>
      <span class="tier-pill" id="featuredTier"></span>
      <div class="featured-score" id="featuredScore"></div>
      <div class="featured-plate" id="featuredPlate"></div>
      <div class="featured-user" id="featuredUser"></div>
      <dl class="featured-fields hidden" id="featuredFields"></dl>
      <div id="featuredReactions"></div>
    </div>

    <section class="list-panel">
      <table class="score-table" id="board">
        <thead id="boardHead">
          <tr><th>#</th><th>משתמש</th><th>לוחית</th><th>דירוג</th><th>ניקוד</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="empty-msg hidden" id="emptyMsg">אין גלגולים שמורים בתקופה זו.</p>
    </section>
  </main>

  <script src="perks.js"></script>
  <script src="breakdown.js"></script>
  <script src="reactions.js"></script>
  <script>
    const buildBreakdownDl = Breakdown.buildBreakdownDl;

    // Username cell linking to the player's public profile. Usernames are validated to
    // letters/digits/underscore/Hebrew, so no HTML-escaping is needed here.
    const userCell = (username) =>
      `<td><a class="username-link" href="/profile.html?user=${encodeURIComponent(username)}">${username}</a></td>`;

    const tbody = document.querySelector("#board tbody");
    const emptyMsg = document.getElementById("emptyMsg");
    const board = document.getElementById("board");
    const featuredRoll = document.getElementById("featuredRoll");
    const featuredTier = document.getElementById("featuredTier");
    const featuredScore = document.getElementById("featuredScore");
    const featuredPlate = document.getElementById("featuredPlate");
    const featuredUser = document.getElementById("featuredUser");
    const featuredFields = document.getElementById("featuredFields");
    const featuredReactions = document.getElementById("featuredReactions");
    const perkToggle = document.getElementById("perkToggle");

    let excludePerks = false;

    function renderTodayHead() {
      document.getElementById("boardHead").innerHTML =
        `<tr><th>#</th><th>משתמש</th><th>לוחית</th><th>דירוג</th><th>ניקוד</th><th></th></tr>`;
    }

    function renderOverallHead() {
      document.getElementById("boardHead").innerHTML =
        `<tr><th>#</th><th>משתמש</th><th class="th-total-score">ניקוד כולל</th></tr>`;
    }

    function renderStreakHead() {
      document.getElementById("boardHead").innerHTML =
        `<tr><th>#</th><th>משתמש</th><th>רצף</th></tr>`;
    }

    async function loadLeaderboard(period) {
      tbody.innerHTML = "";
      board.classList.remove("hidden");
      emptyMsg.classList.add("hidden");
      featuredRoll.classList.add("hidden");

      try {
        const res = await fetch(`/api/leaderboard?period=${period}${excludePerks ? "&excludePerks=1" : ""}`);
        const { leaderboard } = await res.json();

        if (!leaderboard.length) {
          board.classList.add("hidden");
          emptyMsg.classList.remove("hidden");
          return;
        }

        const isRollScope = ["today", "30days", "alltime"].includes(period);

        if (isRollScope) {
          renderTodayHead();
          const top = leaderboard[0];
          featuredTier.textContent = top.tier;
          featuredTier.className = `tier-pill tier-${top.tier.toLowerCase()}`;
          featuredScore.textContent = top.score;
          featuredPlate.textContent = top.plate;
          featuredUser.innerHTML = `<a class="username-link" href="/profile.html?user=${encodeURIComponent(top.username)}"></a>`;
          featuredUser.firstChild.textContent = top.username;
          featuredFields.innerHTML = "";
          if (top.payload) {
            const dl = buildBreakdownDl(top.payload);
            while (dl.firstChild) featuredFields.appendChild(dl.firstChild);
            featuredFields.classList.remove("hidden");
          } else {
            featuredFields.classList.add("hidden");
          }
          featuredReactions.innerHTML = "";
          if (top.id != null) featuredReactions.appendChild(Reactions.renderBar(top.id, top.reactions));
          featuredRoll.classList.remove("hidden");
        } else if (period === "streaks") {
          renderStreakHead();
        } else {
          renderOverallHead();
        }

        const tableRows = isRollScope ? leaderboard.slice(1) : leaderboard;

        if (!tableRows.length) {
          board.classList.add("hidden");
          return;
        }

        for (const row of tableRows) {
          const tr = document.createElement("tr");
          tr.className = "roll-row";

          if (isRollScope) {
            tr.innerHTML = `
              <td>${row.rank}</td>
              ${userCell(row.username)}
              <td class="mono">${row.plate}</td>
              <td><span class="tier-pill tier-${row.tier.toLowerCase()}">${row.tier}</span></td>
              <td class="mono">${row.score}</td>
              <td class="expand-toggle">▾</td>`;
          } else if (period === "streaks") {
            tr.innerHTML = `
              <td>${row.rank}</td>
              ${userCell(row.username)}
              <td><span class="streak-num">${row.streak} 🔥</span></td>`;
          } else {
            tr.innerHTML = `
              <td>${row.rank}</td>
              ${userCell(row.username)}
              <td class="td-total-score"><span class="total-score-num">${row.score}</span></td>`;
          }

          tbody.appendChild(tr);

          const detailContent = isRollScope && row.payload ? buildBreakdownDl(row.payload) : null;

          if (detailContent) {
            const detailTr = document.createElement("tr");
            detailTr.className = "roll-detail hidden";
            const td = document.createElement("td");
            td.colSpan = 6;
            td.appendChild(detailContent);
            if (row.id != null) td.appendChild(Reactions.renderBar(row.id, row.reactions));
            detailTr.appendChild(td);
            tbody.appendChild(detailTr);
            tr.addEventListener("click", (e) => {
              if (e.target.closest(".username-link")) return; // let the link navigate
              const open = !detailTr.classList.contains("hidden");
              detailTr.classList.toggle("hidden", open);
              tr.querySelector(".expand-toggle").textContent = open ? "▾" : "▴";
            });
          }
        }
      } catch {
        emptyMsg.textContent = "תקלה בטעינת הטבלה.";
        emptyMsg.classList.remove("hidden");
      }
    }

    const ROLL_SCOPES = new Set(["today", "30days", "alltime"]);

    document.getElementById("periodTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      document.querySelectorAll("#periodTabs .tab").forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      const period = btn.dataset.period;
      perkToggle.classList.toggle("hidden", !ROLL_SCOPES.has(period));
      loadLeaderboard(period);
    });

    perkToggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".perk-btn");
      if (!btn) return;
      document.querySelectorAll(".perk-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      excludePerks = btn.dataset.mode === "without";
      const activePeriod = document.querySelector("#periodTabs .tab.active").dataset.period;
      loadLeaderboard(activePeriod);
    });

    loadLeaderboard("today");

  </script>
  <footer class="site-footer">
    <nav class="footer-links">
      <a href="/contact.html" class="footer-link">צרו איתי קשר</a>
    </nav>
  </footer>
  <script src="nav.js"></script>
  <script src="push.js"></script>
</body>
</html>
